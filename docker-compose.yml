# NutriBot - Infraestructura de datos (Sprint 1)
# Vector store (Qdrant) + Base de datos (MySQL 8)
# NOTA: Ollama corre NATIVO en Windows (usa la GPU directo); por eso no va aqui.

name: nutribot

services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: nutribot-qdrant
    ports:
      - "6333:6333"   # REST API + Dashboard web -> http://localhost:6333/dashboard
      - "6334:6334"   # gRPC -> lo usa Spring AI por defecto
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.0.46
    container_name: nutribot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: nutribot
      MYSQL_USER: nutribot
      MYSQL_PASSWORD: nutribot123
    ports:
      - "3307:3306"   # 3307 en el host para NO chocar con tu MySQL nativo (3306)
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  qdrant_data:
  mysql_data:
